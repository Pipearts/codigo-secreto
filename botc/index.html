<style>

.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.88);z-index:9;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:14px}

canvas{background:#fafafa;border-radius:10px;-webkit-flex:1;flex:1;width:100%;touch-action:none}

.pl.w .ci{box-shadow:0 0 0 4px #f2cc80,0 0 22px #f2cc80!important}.pl.w:after{content:'DESPIERTA';position:absolute;left:50%;top:-14px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#00658a;color:#c4e7ff;font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid #38bdf8;white-space:nowrap}
.hd{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}.hd img{width:64px;height:64px;margin-right:12px}

.full .b.s{font-size:20px;padding:12px 26px}.full img.tk{width:min(34vw,34vh);height:min(34vw,34vh);margin:1vh 0}.tray{margin:8px 0}.tray .b{display:block;width:100%;background:#3a0f12;border-color:#f20d0d;color:#fff;font-size:18px;margin:6px 0}

<script>
var VER='v4';
window.onerror=function(m,u,l){var a=document.getElementById('app');if(a)a.innerHTML='<div style="padding:20px;color:#f88;font:16px monospace">ERROR: '+m+' (línea '+l+') · '+VER+'</div>'};
if(typeof SC==='undefined'){document.getElementById('app').innerHTML='<div style="padding:20px;font-size:18px">No se ha podido cargar data.js. Comprueba que está en la misma carpeta que index.html.</div>';throw 'nodata'}
var TC={ALDEANO:'#6fd0ff',FORASTERO:'#2b4fe0',ESBIRRO:'#9a1212',DEMONIO:'#ff2222'},TBG={ALDEANO:'#0b3b57',FORASTERO:'#0e1a62',ESBIRRO:'#4a0b0b',DEMONIO:'#8a0000'};
var TAGS=[['ENVENENADO','☠'],['BORRACHO','🍺'],['A SALVO','🛡'],['NIETO','👵'],['FALSO POSITIVO','🔮'],['LOCO','🌀'],['VA A MORIR','🩸'],['SIN HABILIDAD','⛔']];
var CNT={5:[3,0,1],6:[3,1,1],7:[5,0,1],8:[5,1,1],9:[5,2,1],10:[7,0,2],11:[7,1,2],12:[7,2,2],13:[9,0,3],14:[9,1,3],15:[9,2,3]},MOD={'BARÓN':2,'FANG GU':1,'VIGORMORTIS':-1};
var MK={},S=null,V={s:'menu'},app=document.getElementById('app'),cv=null;
try{S=JSON.parse(localStorage.getItem('botc2'))}catch(e){}
S=S||{script:'EL COMIENZO',names:[],roles:[],vis:[],dead:[],ghost:[],notes:[],tags:[],bluffs:[],day:1,nights:0,st:0,nd:[],noms:[],done:{}};
function save(){try{localStorage.setItem('botc2',JSON.stringify(S))}catch(e){}}
function E(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function P(){return SC[S.script]}function active(){return S.roles.length>0&&S.roles.length===S.names.length}
function alive(){var k=0;S.dead.forEach(function(d){if(!d)k++});return k}
function col(r){return TC[R[r].t]}function img(r,c){return '<img class="'+(c||'')+'" src="'+R[r].i+'">'}
function btn(a,t,c,i){return '<button class="b '+(c||'')+'" data-a="'+a+'"'+(i!==undefined?' data-i="'+i+'"':'')+'>'+t+'</button>'}
function hd(t,s){return '<h1>'+t+'</h1><div class="sub">'+(s||'')+'</div>'}
function show(h){app.innerHTML=h}function render(){var f=Rn[V.s];f&&f()}
function go(s,x){V={s:s};for(var k in x)V[k]=x[k];render()}
function dots(n){var s='';for(var i=0;i<n;i++)s+=' <span class="dot">●</span>';return s}
function ring(hl){var n=S.names.length,h='<div class="ring"><div class="ctr"><b>'+(S.nights?'DÍA '+S.day:'NOCHE 1')+'</b>'+alive()+' vivos de '+n+'</div>';
  S.names.forEach(function(nm,i){var a=-Math.PI/2+i*2*Math.PI/n,r=S.roles[i],bd='',w=hl&&hl.indexOf(i)>=0;(S.tags[i]||[]).forEach(function(t){TAGS.forEach(function(x){if(x[0]===t)bd+=x[1]})});
    h+='<div class="pl'+(S.dead[i]?' x':'')+(w?' w':'')+'" data-a="pl" data-i="'+i+'" style="left:'+(50+41*Math.cos(a))+'%;top:'+(50+39*Math.sin(a))+'%"><div class="ci" style="border-color:'+col(r)+';box-shadow:0 0 12px '+col(r)+'">'+img(r)+(S.dead[i]?'<s>✝</s>':'')+(bd?'<span class="bd">'+bd+'</span>':'')+(S.dead[i]&&S.ghost[i]?'<span class="gv">🗳</span>':'')+'</div><b>'+E(nm)+'</b><i>'+R[r].n+'</i>'+(S.notes[i]?'<em class="nt">'+E(S.notes[i])+'</em>':'')+'</div>'});
  return h+'</div>'}
function steps(n){var out=[];P()['n'+n].forEach(function(x){var k=x[0],sp=SP[k]!==undefined,w=[];if(!sp){S.roles.forEach(function(r,i){if(S.vis[i]===k)w.push(i)});if(!w.length)return}out.push({k:k,t:x[1],d:x[2],w:w})});return out}
function fit(){var r=document.querySelector('.ring');if(!r)return;var t=Math.max(40,Math.min(78,Math.min(r.clientWidth,r.clientHeight)/(S.names.length<=8?5.4:S.names.length<=11?6.4:7.4)));r.style.setProperty('--t',t+'px')}
window.addEventListener('resize',function(){setTimeout(fit,120)});window.addEventListener('orientationchange',function(){setTimeout(fit,300)});
var Rn={
menu:function(){var h='<div class="sc"><div class="mid"><img src="icon-180.png" width="100" height="100" style="border-radius:22px"><h1>GRIMORIO</h1><div class="sub">BLOOD ON THE CLOCKTOWER</div><div class="bar">';
  Object.keys(SC).forEach(function(k){h+=btn('scr',k,'s'+(S.script===k?' on':''),k)});h+='</div>';
  if(active())h+=btn('grim','CONTINUAR PARTIDA ('+S.script+')','r');
  show(h+btn('count','REPARTO DE PERSONAJES')+btn('chars','PERSONAJES DEL GUION')+btn('upd','↻ ACTUALIZAR APP','s')+'<div class="ver">'+VER+'</div></div></div>')},
count:function(){var h='<div class="sc"><div class="mid">'+hd('¿CUÁNTOS JUGADORES?',S.script)+'<div class="g">';for(var n=5;n<=15;n++)h+=btn('names',n,'',n);show(h+'</div>'+btn('menu','VOLVER','s')+'</div></div>')},
names:function(){var h='<div class="sc"><div class="mid">'+hd('NOMBRES DE LOS JUGADORES',V.n+' jugadores · en el orden en que están sentados · '+S.script);
  for(var i=0;i<V.n;i++)h+='<input class="nm" placeholder="Jugador '+(i+1)+'" value="'+E(S.names.length===V.n&&S.names[i]||'')+'" maxlength="16">';
  show(h+btn('deal','REPARTIR PERSONAJES','r')+btn('count','VOLVER','s')+'</div></div>')},
pass:function(){var nm=S.names[V.i];show('<div class="mid">'+hd('REPARTO SECRETO','JUGADOR '+(V.i+1)+' DE '+S.names.length)+'<div class="big">'+E(nm)+'</div><p style="font-size:20px">Pasa la tablet a <b>'+E(nm)+'</b>.<br>Cuando nadie más pueda ver la pantalla, descubre tu personaje.</p>'+btn('reveal','DESCUBRIR MI PERSONAJE','r')+'</div>')},
reveal:function(){var r=S.vis[V.i];show('<div class="mid">'+hd('ESTE PERSONAJE ES SECRETO','')+'<div class="card" style="display:block;text-align:center;border:3px solid '+col(r)+'">'+img(r,'ic')+'<div class="sub" style="margin:6px">'+R[r].t+'</div><div class="big" style="font-size:36px">'+R[r].n+'</div><p style="font-size:19px">'+E(R[r].d)+'</p></div>'+btn('hide','OCULTAR PERSONAJE','r')+'</div>')},
done:function(){show('<div class="mid">'+hd('REPARTO COMPLETADO','')+'<p style="font-size:20px">Todos los personajes han sido repartidos.<br>El Grimorio está listo.</p>'+btn('grim','ABRIR GRIMORIO','r')+'</div>')},
grim:function(){var nn=S.nights+1;show(hd('GRIMORIO',S.script)+ring()+'<div class="bar">'+btn('nw','🌙 '+(S.nights?'NOCHE '+nn:'1ª NOCHE'),'s on')+btn('lst','LISTA','s')+btn('sigs','FICHAS','s')+btn('votes','NOMINACIONES','s')+btn('menu','⌂ INICIO','s')+'</div>');fit()},
nw:function(){var st=steps(V.n),i=Math.max(0,Math.min(S.st||0,st.length-1)),x=st[i],k=x.k,sp=SP[k]!==undefined,nm=sp?k:R[k].n,ic=sp?SP[k]:R[k].i,last=i===st.length-1,names=x.w.map(function(j){return E(S.names[j])+(S.dead[j]?' ✝':'')}).join(' y '),dead=x.w.length&&x.w.every(function(j){return S.dead[j]}),hl=x.w.slice(),p='';
  if(k==='ESBIRROS'||k==='DEMONIOS'){S.roles.forEach(function(r,j){if(R[r].t===(k==='ESBIRROS'?'ESBIRRO':'DEMONIO'))hl.push(j)})}
  var es=[],de='';S.roles.forEach(function(r,j){if(R[r].t==='ESBIRRO')es.push(S.names[j]);if(R[r].t==='DEMONIO')de=S.names[j]});
  p+='<div class="pg"><i style="width:'+Math.round((i+1)*100/st.length)+'%"></i></div><div class="hd"><img src="'+ic+'"><div><small style="color:#c79c4d">PASO '+(i+1)+' DE '+st.length+'</small><br><b style="font-size:24px;color:#f2cc80">'+nm+'</b></div></div>';
  if(dead)p+='<div class="wk2"><b>JUGADOR MUERTO — NO DESPIERTA</b><br>Un jugador muerto no despierta para usar su habilidad (salvo que ésta se active al morir: lee el texto).</div>';
  else if(x.w.length)p+='<div class="wk">🌙 <b>DESPIERTA A:</b> '+names+'</div>';
  if(sp&&(k==='ESBIRROS'||k==='DEMONIOS')&&S.names.length<7)p+='<div class="wk2">Con menos de 7 jugadores este paso no se hace.</div>';
  p+='<p style="font-size:18px;margin:8px 0">'+E(x.t)+dots(x.d)+'</p>';
  if(k==='ESBIRROS')p+='<div class="card"><div>Esbirros: <b>'+E(es.join(', '))+'</b><br>Demonio: <b>'+E(de)+'</b></div></div>';
  if(k==='DEMONIOS')p+='<div class="card"><div>Esbirros: <b>'+E(es.join(', '))+'</b><br>Coartadas: '+S.bluffs.map(function(b){return '<img src="'+R[b].i+'" width="36" height="36" style="vertical-align:middle"> <b>'+R[b].n+'</b>'}).join(' · ')+'<br>'+btn('nb','OTRAS COARTADAS','s')+'</div></div>';
  if(x.w.length&&!dead)p+='<div style="color:#8a7a5a;font-size:15px">Al terminar: 💤 manda a dormir a '+names+'.</div>';
  if(TRAY[k]){p+='<div class="tray">';TRAY[k].forEach(function(t){p+=btn('tk',t[1],'',t[0])});p+='</div>'}
  if(k==='AMANECER'){p+='<h2>¿Quién ha muerto esta noche?</h2><div>';S.names.forEach(function(n,j){if(!S.dead[j]){var on=S.nd.indexOf(j)>=0||((S.tags[j]||[]).indexOf('VA A MORIR')>=0&&S.nd.indexOf(-j-1)<0);p+='<span class="ch'+(on?' on':'')+'" data-a="dw" data-i="'+j+'">'+E(n)+'</span>'}});p+='</div>'}
  p+='<div class="bar" style="margin-top:10px">'+(i>0?btn('pv','◀ ANTERIOR','s'):'')+btn('pk','🎯 MARCAR JUGADOR','s')+btn('lst','LISTA','s')+(last?btn('dc','☀ AMANECER','s on'):btn('nx','SIGUIENTE ▶','s on'))+'</div>';
  show(hd('NOCHE '+(V.n===1?1:S.nights+1),S.script)+'<div class="nw">'+ring(hl)+'<div class="pn">'+p+'</div></div><div class="bar">'+btn('grim','⌂ GRIMORIO','s')+'</div>');fit()},
night:function(){var o=P()['n'+V.n],h=hd(V.n===1?'PRIMERA NOCHE':'NOCHES SIGUIENTES','ORDEN DE INTERVENCIONES')+'<div class="sc">',k=0,es=[],de='';
  S.roles.forEach(function(r,i){if(R[r].t==='ESBIRRO')es.push(S.names[i]);if(R[r].t==='DEMONIO')de=S.names[i]});
  o.forEach(function(x){var key=x[0],sp=SP[key]!==undefined,w=[],d=false,ic=sp?SP[key]:(R[key]&&R[key].i),nm=sp?key:(R[key]?R[key].n:key),extra='';
    if(sp){d=(key==='ESBIRROS'||key==='DEMONIOS')&&S.names.length<7;if(key==='ESBIRROS')extra='<br>Esbirros: <b>'+E(es.join(', '))+'</b> · Demonio: <b>'+E(de)+'</b>';
      if(key==='DEMONIOS')extra='<br>Coartadas: '+S.bluffs.map(function(b){return '<img src="'+R[b].i+'" width="34" height="34" style="vertical-align:middle"> <b>'+R[b].n+'</b>'}).join(' · ')+' '+btn('nb','OTRAS','s')}
    else{var any=false;S.roles.forEach(function(r,i){if(S.vis[i]===key){var t=S.names[i]+(S.roles[i]==='BORRACHO'?' 🍺 (BORRACHO: info falsa)':'')+(S.dead[i]?' ✝':'');w.push(t);if(!S.dead[i])any=true}});if(!w.length)return;d=!any&&V.n===2}
    k++;var id=(V.n)+key;h+='<div class="card'+(d?' d':'')+(S.done[id]?' ok':'')+'" data-a="ck" data-i="'+id+'">'+(ic?'<img class="ni" src="'+ic+'">':'')+'<div><small>'+k+'.</small><b>'+nm+'</b>'+(w.length?' — '+E(w.join(' y ')):'')+'<div>'+E(x[1])+dots(x[2])+extra+'</div></div></div>'});
