<style>

<script>

try{S=JSON.parse(localStorage.getItem('botc2'))}catch(e){}

function save(){try{localStorage.setItem('botc2',JSON.stringify(S))}catch(e){}}

function dots(n){var s='';for(var i=0;i<n;i++)s+=' <span class="dot">●</span>';return s}

var Rn={
menu:function(){var h='<div class="sc"><div class="mid"><img src="icon-180.png" width="100" height="100" style="border-radius:22px"><h1>GRIMORIO</h1><div class="sub">BLOOD ON THE CLOCKTOWER</div><div class="bar">';

  show(h+btn('deal','REPARTIR PERSONAJES','r')+btn('count','VOLVER','s')+'</div></div>')},
pass:function(){var nm=S.names[V.i];show('<div class="mid">'+top('REPARTO SECRETO','JUGADOR '+(V.i+1)+' DE '+S.names.length)+'<div class="big">'+E(nm)+'</div><p style="font-size:20px">Pasa la tablet a <b>'+E(nm)+'</b>.<br>Cuando nadie más pueda ver la pantalla, descubre tu personaje.</p>'+btn('reveal','DESCUBRIR MI PERSONAJE','r')+'</div>')},
reveal:function(){var r=S.vis[V.i];show('<div class="mid">'+top('ESTE PERSONAJE ES SECRETO','')+'<div class="card" style="display:block;text-align:center;border:3px solid '+col(r)+'">'+img(r,'ic')+'<div class="sub" style="margin:6px">'+R[r].t+'</div><div class="big" style="font-size:36px">'+R[r].n+'</div><p style="font-size:19px">'+E(R[r].d)+'</p></div>'+btn('hide','OCULTAR PERSONAJE','r')+'</div>')},
done:function(){show('<div class="mid">'+top('REPARTO COMPLETADO','')+'<p style="font-size:20px">Todos los personajes han sido repartidos.<br>El Grimorio está listo.</p>'+btn('grim','ABRIR GRIMORIO','r')+'</div>')},
grim:function(){var n=S.names.length,h=top('GRIMORIO',S.script)+'<div class="ring"><div class="ctr"><b>DÍA '+S.day+'</b>'+alive()+' vivos de '+n+'</div>';
  S.names.forEach(function(nm,i){var a=-Math.PI/2+i*2*Math.PI/n,r=S.roles[i],bd='';(S.tags[i]||[]).forEach(function(t){TAGS.forEach(function(x){if(x[0]===t)bd+=x[1]})});
    h+='<div class="pl'+(S.dead[i]?' x':'')+'" data-a="pl" data-i="'+i+'" style="left:'+(50+41*Math.cos(a))+'%;top:'+(50+39*Math.sin(a))+'%"><div class="ci" style="border-color:'+col(r)+'">'+img(r)+(S.dead[i]?'<s>✝</s>':'')+(bd?'<span class="bd">'+bd+'</span>':'')+(S.dead[i]&&S.ghost[i]?'<span class="gv">🗳</span>':'')+'</div><b>'+E(nm)+'</b><i>'+R[r].n+'</i></div>'});
  show(h+'</div><div class="bar">'+btn('n1','1ª NOCHE','s')+btn('n2','NOCHES','s')+btn('sigs','FICHAS','s')+btn('votes','NOMINACIONES','s')+btn('menu','⌂ INICIO','s')+'</div>');fit()},
night:function(){var o=P()['n'+V.n],h=top(V.n===1?'PRIMERA NOCHE':'NOCHES SIGUIENTES','ORDEN DE INTERVENCIONES')+'<div class="sc">',k=0,es=[],de='';
  S.roles.forEach(function(r,i){if(R[r].t==='ESBIRRO')es.push(S.names[i]);if(R[r].t==='DEMONIO')de=S.names[i]});
  o.forEach(function(x){var key=x[0],sp=SP[key]!==undefined,w=[],d=false,ic=sp?SP[key]:(R[key]&&R[key].i),nm=sp?key:(R[key]?R[key].n:key),extra='';
    if(sp){d=(key==='ESBIRROS'||key==='DEMONIOS')&&S.names.length<7;if(key==='ESBIRROS')extra='<br>Esbirros: <b>'+E(es.join(', '))+'</b> · Demonio: <b>'+E(de)+'</b>';
      if(key==='DEMONIOS')extra='<br>Coartadas: '+S.bluffs.map(function(b){return '<img src="'+R[b].i+'" width="34" height="34" style="vertical-align:middle"> <b>'+R[b].n+'</b>'}).join(' · ')+' '+btn('nb','OTRAS','s')}
    else{var any=false;S.roles.forEach(function(r,i){if(S.vis[i]===key){var t=S.names[i]+(S.roles[i]==='BORRACHO'?' 🍺 (BORRACHO: info falsa)':'')+(S.dead[i]?' ✝':'');w.push(t);if(!S.dead[i])any=true}});if(!w.length)return;d=!any&&V.n===2}
    k++;var id=(V.n)+key;h+='<div class="card'+(d?' d':'')+(S.done[id]?' ok':'')+'" data-a="ck" data-i="'+id+'">'+(ic?'<img class="ni" src="'+ic+'">':'')+'<div><small>'+k+'.</small><b>'+nm+'</b>'+(w.length?' — '+E(w.join(' y ')):'')+'<div>'+E(x[1])+dots(x[2])+extra+'</div></div></div>'});
  show(h+'</div><div class="bar">'+btn('grim','VOLVER AL GRIMORIO','s')+btn(V.n===1?'n2':'n1',V.n===1?'NOCHES SIGUIENTES':'PRIMERA NOCHE','s')+'</div>')},
sigs:function(){show(top('FICHAS DEL NARRADOR','SEÑALES RÁPIDAS')+'<div class="sc"><div class="mid">'+btn('sg','ES EL DEMONIO','r','dem')+btn('sg','ES TU ESBIRRO','r','min')+btn('sg','SEÑALA A ALGUIEN','','pt')+btn('sg','TUS COARTADAS','','bl')+btn('sg','TÚ ERES…','','ti')+btn('sg','ES TU NIETO Y SU PERSONAJE ES…','','ni')+btn('sg','ESTE PERSONAJE TE HA ELEGIDO','','el')+btn('sg','👍 / 👎','','pg')+btn('board','PIZARRA')+'</div></div><div class="bar">'+btn('grim','VOLVER AL GRIMORIO','s')+'</div>')},
votes:function(){var h=top('NOMINACIONES','DÍA '+S.day+' · '+alive()+' vivos · mayoría: '+Math.ceil(alive()/2))+'<div class="sc">',b=block();
  if(b.t)h+='<div class="card hl"><div>'+(b.tie?'<b>EMPATE</b> entre los más votados: nadie sería ejecutado.':'<b>EN EL PATÍBULO:</b> '+E(S.names[b.i])+' con '+b.v+' votos'+btn('exe','EJECUTAR A '+E(S.names[b.i]).toUpperCase(),'r',b.i))+'</div></div>';
  var any=false;for(var d=S.day;d>=1;d--){var l=S.noms.filter(function(n){return n.d===d});if(!l.length)continue;any=true;h+='<h2>DÍA '+d+'</h2>';
    l.forEach(function(n){var ix=S.noms.indexOf(n);h+='<div class="card"><div><small>NOMINACIÓN '+(l.indexOf(n)+1)+(n.ex?' · EJECUTADO':'')+'</small><b>'+E(S.names[n.a])+'</b> nomina a <b>'+E(S.names[n.b])+'</b><br>'+n.v.length+(n.v.length===1?' voto':' votos')+' (mayoría '+n.m+'): '+(n.v.length?E(n.v.map(function(i){return S.names[i]}).join(', ')):'nadie')+'</div>'+btn('del','✕','s',ix)+'</div>'})}
  if(!any)h+='<p style="text-align:center">Todavía no hay nominaciones.</p>';
  show(h+'</div><div class="bar">'+btn('nom','NUEVA NOMINACIÓN','r')+btn('day','☀ NUEVO DÍA','s')+btn('grim','VOLVER','s')+'</div>')},
nom1:function(){var h=top('¿QUIÉN NOMINA?','DÍA '+S.day+' · jugadores vivos que aún no han nominado hoy')+'<div class="sc">';S.names.forEach(function(n,i){if(!S.dead[i]){var u=S.noms.some(function(x){return x.d===S.day&&x.a===i});h+='<button class="b" data-a="n2" data-i="'+i+'"'+(u?' disabled':'')+'>'+E(n)+(u?' (ya nominó)':'')+'</button>'}});show(h+'</div><div class="bar">'+btn('votes','CANCELAR','s')+'</div>')},
nom2:function(){var h=top('¿A QUIÉN NOMINA '+E(S.names[V.a]).toUpperCase()+'?','solo se puede nominar una vez a cada jugador por día')+'<div class="sc">';S.names.forEach(function(n,i){if(i!==V.a){var u=S.noms.some(function(x){return x.d===S.day&&x.b===i});h+='<button class="b" data-a="n3" data-i="'+i+'"'+(u?' disabled':'')+'>'+E(n)+(S.dead[i]?' ✝':'')+(u?' (ya nominado)':'')+'</button>'}});show(h+'</div><div class="bar">'+btn('votes','CANCELAR','s')+'</div>')},
vote:function(){var n=S.names.length,h=top('VOTACIÓN','<b>'+E(S.names[V.a])+'</b> nomina a <b>'+E(S.names[V.b])+'</b> · '+(V.vt.filter(Boolean).length)+' votos · mayoría '+Math.ceil(alive()/2))+'<div class="sc">';
  for(var k=1;k<=n;k++){var i=(V.b+k)%n;if(!S.dead[i]||S.ghost[i])h+=btn('tg',(V.vt[i]?'☑ ':'☐ ')+E(S.names[i])+(S.dead[i]?' ✝ (voto fantasma)':''),V.vt[i]?'on':'',i)}
  show(h+'</div><div class="bar">'+btn('reg','REGISTRAR VOTACIÓN','r')+btn('votes','CANCELAR','s')+'</div>')},
chars:function(){var p=P(),h=top('PERSONAJES',S.script)+'<div class="sc">';[['a','ALDEANOS'],['f','FORASTEROS'],['e','ESBIRROS'],['d','DEMONIOS']].forEach(function(g){h+='<h2 style="color:'+TC[R[p[g[0]][0]].t]+'">'+g[1]+'</h2>';p[g[0]].forEach(function(n){h+='<div class="card" style="border-color:'+col(n)+'">'+img(n,'ni')+'<div><b>'+R[n].n+'</b><div>'+E(R[n].d)+'</div></div></div>'})});show(h+'</div><div class="bar">'+btn('menu','VOLVER','s')+'</div>')},
board:function(){show(top('PIZARRA','')+'<canvas id="cv"></canvas><div class="bar">'+btn('clr','BORRAR','s')+btn('sigs','VOLVER','s')+'</div>');var c=document.getElementById('cv');c.width=c.clientWidth;c.height=c.clientHeight;var x=c.getContext('2d'),d=false;x.lineWidth=3;x.lineCap='round';x.lineJoin='round';
  function pt(e){var r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]}
  function st(e){e.preventDefault();d=true;var p=pt(e);x.beginPath();x.moveTo(p[0],p[1])}function mv(e){if(!d)return;e.preventDefault();var p=pt(e);x.lineTo(p[0],p[1]);x.stroke()}function en(){d=false}
  c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en);c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);cv=c}
};
function block(){var m=0,l=[],mj;S.noms.forEach(function(n){if(n.d===S.day&&n.v.length>=n.m&&n.v.length>0){if(n.v.length>m){m=n.v.length;l=[n]}else if(n.v.length===m)l.push(n)}});return l.length?{t:1,tie:l.length>1,i:l[0].b,v:m}:{t:0}}
function ov(h){closeOv();var d=document.createElement('div');d.className='ov';d.id='ov';d.innerHTML='<div>'+h+'</div>';document.body.appendChild(d)}
function closeOv(){var o=document.getElementById('ov');if(o)o.parentNode.removeChild(o)}
function full(c,h){closeOv();var d=document.createElement('div');d.className='full';d.id='ov';d.style.background=c;d.innerHTML=h+'<button class="b s" data-a="cl" style="margin-top:30px">CERRAR</button>';document.body.appendChild(d)}
function ficha(i){var r=S.roles[i],v=S.vis[i],t=S.tags[i]||[];
  var inf='<div class="sub" style="color:'+col(r)+'">'+R[r].t+'</div><b style="font-size:24px;color:#f2cc80">'+R[r].n+'</b><p>'+E(R[r].d)+'</p>'+(r==='BORRACHO'?'<div class="card" style="display:block;text-align:center">CREE SER:<br>'+img(v,'ic')+'<br><b>'+R[v].n+'</b></div>':'');
  var ch='';TAGS.forEach(function(x){ch+='<span class="ch'+(t.indexOf(x[0])>=0?' on':'')+'" data-a="tag" data-i="'+i+'|'+x[0]+'">'+x[1]+' '+x[0]+'</span>'});
  ov('<h2 style="margin-top:0">'+E(S.names[i])+'</h2>'+img(r,'ic')+inf+btn('dead',(S.dead[i]?'☑':'☐')+' MUERTO','',i)+(S.dead[i]?btn('gh',(S.ghost[i]?'☑':'☐')+' VOTO FANTASMA DISPONIBLE','',i):'')+'<div>'+ch+'</div><textarea id="nt" rows="2" placeholder="Anotaciones del Narrador">'+E(S.notes[i]||'')+'</textarea>'+btn('sv','GUARDAR Y CERRAR','r',i))}
function keepNote(i){var n=document.getElementById('nt');if(n){S.notes[i]=n.value}}
function deal(){var n=S.names.length,c=CNT[n].slice(),p=P(),mi=shuf(p.e.slice()).slice(0,c[2]),de=p.d[Math.floor(Math.random()*p.d.length)];
  c[1]=Math.max(0,c[1]+(MOD[de]||0)+mi.reduce(function(s,m){return s+(MOD[m]||0)},0));c[0]=n-c[1]-c[2]-1;
  var r=shuf(p.a.slice()).slice(0,c[0]).concat(shuf(p.f.slice()).slice(0,c[1]),mi,[de]);
  if(r.length!==n||c[0]<0){alert('El guion no tiene suficientes personajes para esta composición. Prueba con otro número de jugadores.');return false}
  S.roles=shuf(r);var free=shuf(p.a.filter(function(a){return S.roles.indexOf(a)<0}));
